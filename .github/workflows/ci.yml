name: Publish Jake Notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: site-dist
          path: dist
      - name: Verify publication artifact
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/theorems.json
          test -f dist/sitemap.xml
          test -d dist/_astro
      - name: Publish tested Astro output to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: false
          force_orphan: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Deploy Astro site from ${{ github.sha }}
