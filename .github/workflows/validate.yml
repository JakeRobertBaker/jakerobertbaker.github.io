name: Validate site
on:
  # Same-repository branch pushes also report checks on their pull requests.
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Upload the tested dist/ as the GitHub Pages artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        timeout-minutes: 10
        run: |
          # Bound each attempt as well as the step: apt/DNS can otherwise hang for hours.
          for attempt in 1 2 3; do
            echo "Browser installation attempt $attempt/3"
            if timeout --kill-after=15s 3m npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Browser installation failed; retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Browser installation failed after 3 attempts."
          exit 1
      - run: npm run validate
      - name: Upload the tested site for deployment
        if: inputs.publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
