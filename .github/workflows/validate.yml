name: Validate site
on:
  # Same-repository branch pushes also report checks on their pull requests.
  push:
    branches-ignore: [main, gh-pages]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Upload the tested dist/ as the GitHub Pages artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Upload the tested site for deployment
        if: inputs.publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
