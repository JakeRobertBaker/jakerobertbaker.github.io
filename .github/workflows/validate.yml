name: Validate site
on:
  push:
    branches-ignore: [main, gh-pages]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:math
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview
      - run: npm run test:site
      - name: Preserve the tested site for the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
